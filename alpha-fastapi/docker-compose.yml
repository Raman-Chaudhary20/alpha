version: "3.9"

services:
  alpha-bot:
    build: .
    ports:
      - "${PORT:-8000}:8000"
    env_file: .env
    volumes:
      - ./data:/app/data
      # Bedrock: the AWS sign-in of AWS_PROFILE, read-only. Not needed on a server with an instance role.
      - ${HOME}/.aws:/root/.aws:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
